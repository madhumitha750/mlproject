name: ML Model Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t student-ml-app:latest .

      - name: Run Docker container
        run: |
          docker run -d --name student-ml-test -p 5000:5000 student-ml-app:latest

      - name: Test application health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5000/health; then
              echo "ML application is running successfully"
              exit 0
            fi
            sleep 2
          done
          docker logs student-ml-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f student-ml-test || true
